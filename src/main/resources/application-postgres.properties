server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/task_manager}
spring.datasource.username=${DB_USERNAME:task_manager}
spring.datasource.password=${DB_PASSWORD:task_manager_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false

spring.servlet.multipart.max-file-size=${PROFILE_PICTURE_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${PROFILE_PICTURE_MAX_REQUEST_SIZE:5MB}

app.security.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-production-secret}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.security.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}
app.frontend.password-reset-url=${PASSWORD_RESET_URL:taskmanager://reset-password}
app.mail.from=${MAIL_FROM:no-reply@taskmanager.local}
app.profile-pictures.upload-dir=${PROFILE_PICTURE_UPLOAD_DIR:uploads/profile-pictures}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
